name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la toma de "packageManager" en package.json.
      # Declararla en los dos lados aborta con ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests de parsers y copy
        run: pnpm test

      - name: Checks determinísticos de diseño
        run: pnpm check:design

      - name: Build (tolera NOAA caído vía seed)
        run: pnpm build
